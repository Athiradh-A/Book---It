services:
  db:
    image: postgres:15-alpine
    container_name: campus_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campus_room_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: campus_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: campus_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: campus_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  campusroom-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: campusroom
      POSTGRES_USER: campusroom
      POSTGRES_PASSWORD: campusroom
    volumes:
      - campusroom_data:/var/lib/postgresql/data

  campusroom:
    build: ./backend/campusroom
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://campusroom:campusroom@campusroom-db:5432/campusroom
      JWT_SECRET: ${CAMPUSROOM_JWT_SECRET:-replace-this-in-production}
      PORT: 3000
    depends_on:
      - campusroom-db

volumes:
  postgres_data:
  campusroom_data:
